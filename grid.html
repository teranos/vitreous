<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grid</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: grid; place-items: center; background: #fff; font: 13px/1 ui-sans-serif, system-ui, sans-serif; color: #444; }

  .frame {
    --size: min(72vw, 72vh);
    --rail: 4rem;
    display: grid;
    grid-template-columns: var(--rail) var(--size);
    grid-template-rows: var(--size) var(--rail);
    gap: 0.75rem;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(10, 1fr);
    gap: calc(var(--size) / 60);
  }
  .grid div { border-radius: 18%; background: #ddd; }

  /* Each slider is exactly the grid's length; its maximum sits past the end. */
  .y, .x { position: relative; display: grid; place-items: center; }
  .y input[type=range] { writing-mode: vertical-lr; direction: rtl; height: var(--size); width: auto; margin: 0; }
  .x input[type=range] { width: var(--size); margin: 0; }
  input[type=range] { accent-color: currentColor; }
  /* Mirrored across the diagonal: each maximum past the far end, each minimum
     past the near end, the same distance out. */
  .y .num, .x .num { position: absolute; }
  .y .num { left: 50%; transform: translateX(-50%); }
  .x .num { top: 50%; transform: translateY(-50%); }
  #y-max { bottom: 100%; margin-bottom: 0.25rem; }
  /* The minimums: the bottom one under its slider at the leftmost end, the
     left one beside its slider at the bottommost end, right side against it. */
  #y-min { bottom: 0; right: calc(50% + 0.6rem); left: auto; transform: none; }
  #x-min { left: 0; top: calc(50% + 0.6rem); right: auto; transform: none; }
  #x-max { left: 100%; margin-left: 0.25rem; }

  .num {
    width: 3.5rem; padding: 0.2rem 0.25rem; text-align: center;
    font: inherit; font-variant-numeric: tabular-nums; color: inherit;
    border: 1px solid #ccc; border-radius: 6px; background: #fff;
  }
  .num:focus { border-color: #444; outline: none; }

  /* Which parameter each slider is, outside its rail. */
  .name, .page { position: absolute; white-space: nowrap; font-weight: 600;
    padding: 0.2rem 0.4rem; border: 1px solid #ccc; border-radius: 6px; background: #fff; }
  .x .name { top: 100%; margin-top: 0.25rem; left: 50%; transform: translateX(-50%); }
  .y .name { right: 100%; margin-right: 0.25rem; top: 50%; writing-mode: vertical-lr; transform: translateY(-50%) rotate(180deg); }
  /* Two identical tiles of cloud side by side, slid one tile's width and
     looped, so the drift never jumps. */
  .clouds {
    position: fixed; top: 0; left: 0; width: 200%; height: 100%;
    z-index: -1; pointer-events: none;
    background:
      radial-gradient(ellipse 11% 10% at 18% 22%, #fff 40%, transparent 72%),
      radial-gradient(ellipse 9% 8% at 30% 25%, #fff 35%, transparent 70%),
      radial-gradient(ellipse 13% 11% at 68% 38%, #fff 40%, transparent 72%),
      radial-gradient(ellipse 10% 9% at 80% 34%, #f1f5f9 35%, transparent 70%),
      radial-gradient(ellipse 12% 10% at 35% 70%, #fff 40%, transparent 72%),
      radial-gradient(ellipse 9% 8% at 50% 74%, #eef3f8 35%, transparent 70%),
      radial-gradient(ellipse 11% 9% at 85% 82%, #fff 40%, transparent 72%);
    background-size: 50% 100%;
    background-repeat: repeat-x;
    animation: drift 90s linear infinite;
  }
  @keyframes drift { to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .clouds { animation: none; } }

  .night { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

  .page { position: fixed; top: 1rem; left: 50%; transform: translateX(-50%); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="clouds" id="clouds" hidden></div>
  <canvas class="night" id="night" hidden></canvas>
  <div class="page" id="page"></div>
  <div class="frame">
    <div class="y">
      <span class="name" id="y-name"></span>
      <input class="num" id="y-max" value="1">
      <input type="range" id="y" aria-label="y">
      <input class="num" id="y-min" value="0" aria-label="y minimum">
    </div>
    <div class="grid" id="grid"></div>
    <div></div>
    <div class="x">
      <input class="num" id="x-min" value="0" aria-label="x minimum">
      <input type="range" id="x" aria-label="x">
      <input class="num" id="x-max" value="1">
      <span class="name" id="x-name"></span>
    </div>
  </div>
<script>
  // Every parameter: its value as shipped, and the range the system allows.
  const P = {
    'glass-alpha':              { v: 0.64, lo: 0,    hi: 1 },
    'glass-strong-alpha':       { v: 0.88, lo: 0,    hi: 1 },
    'glass-border-alpha':       { v: 0.55, lo: 0,    hi: 1 },
    'glass-blur':               { v: 24,   lo: 0,    hi: 60 },
    'glass-saturate':           { v: 1,    lo: 0,    hi: 3 },
    'glass-brightness':         { v: 1,    lo: 0.5,  hi: 1.5 },
    'glass-thin-alpha':         { v: 0.42, lo: 0,    hi: 1 },
    'glass-thin-border-alpha':  { v: 0.66, lo: 0,    hi: 1 },
    'glass-thin-blur':          { v: 7,    lo: 0,    hi: 60 },
    'glass-thin-saturate':      { v: 1.2,  lo: 0,    hi: 3 },
    'glass-thin-brightness':    { v: 1,    lo: 0.5,  hi: 1.5 },
    'shadow-x':                 { v: 12,   lo: -120, hi: 120 },
    'shadow-y':                 { v: 21,   lo: -120, hi: 120 },
    'shadow-blur':              { v: 32,   lo: 0,    hi: 200 },
    'shadow-spread':            { v: -17,  lo: -120, hi: 120 },
    'shadow-alpha':             { v: 0.55, lo: 0,    hi: 1 },
  };
  const names = Object.keys(P);
  const pages = [];
  for (let i = 0; i < names.length; i++)
    for (let j = i + 1; j < names.length; j++) pages.push([names[i], names[j]]);
  let page = 0;

  // What sits behind the grid. Up and down page through these; each entry is a
  // CSS background.
  const patterns = [
    'none',
    'repeating-linear-gradient(45deg, #e4e4e4 0 10px, #fff 10px 20px)',
    // Cloudy sky: the sky here, the clouds on #clouds, drifting.
    'linear-gradient(#5b9bd5, #a9cdef 70%, #d6e8f7) fixed',
    // Night: the sky here, everything in it drawn on #night.
    'linear-gradient(#05081a, #0f1736 60%, #1c2550) fixed',
  ];
  const SKY = 2, NIGHT = 3;
  let pattern = 0;

  const $ = id => document.getElementById(id);
  const grid = $('grid');
  grid.innerHTML = '<div></div>'.repeat(100);
  const cells = [...grid.children];
  const round = n => +n.toFixed(2);
  // The slider is where the grid looks closest. The middle 4 rows (or columns)
  // span 20% of the range around it, held inside the range at the ends; the 3
  // on each side spread what is left out to the minimum and the maximum.
  function stop(p, k) {
    const { lo, hi } = P[p], f = P[p].f ?? P[p].v, w = (hi - lo) * 0.2;
    const a = Math.min(Math.max(f - w / 2, lo), hi - w), b = a + w;
    if (k < 3) return round(lo + (a - lo) * k / 3);
    if (k < 7) return round(a + w * (k - 3) / 3);
    return round(b + (hi - b) * (k - 6) / 3);
  }

  // A square is the glass drawn with every parameter as set, except the two on the axes.
  function glass(v, thin) {
    const g = thin ? 'glass-thin' : 'glass';
    const filter = `blur(${v[g + '-blur']}px) saturate(${v[g + '-saturate']}) brightness(${v[g + '-brightness']})`;
    return `background: rgb(255 255 255 / ${v[g + '-alpha']});`
      + `border: 1px solid rgb(255 255 255 / ${v[g + '-border-alpha']});`
      + `backdrop-filter: ${filter}; -webkit-backdrop-filter: ${filter};`
      + `box-shadow: ${v['shadow-x']}px ${v['shadow-y']}px ${v['shadow-blur']}px ${v['shadow-spread']}px rgb(10 31 43 / ${v['shadow-alpha']});`;
  }

  // The night: stars, a half moon crossing slowly, a shooting star now and
  // then, and a leaf falling from a tree. Runs only while it is the pattern.
  const night = (() => {
    const canvas = $('night'), ctx = canvas.getContext('2d');
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let w = 0, h = 0, stars = [], frame = 0, start = 0, shot = null, nextShot = 0, leaf = null;

    function size() {
      const dpr = devicePixelRatio || 1;
      w = innerWidth; h = innerHeight;
      canvas.width = w * dpr; canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      stars = Array.from({ length: Math.round(w * h / 4000) }, () => ({
        x: Math.random() * w, y: Math.random() * h * 0.85,
        r: Math.random() * 1.2 + 0.3, p: Math.random() * Math.PI * 2,
      }));
    }

    // The tree stands in the bottom-right corner; the leaf leaves its crown.
    const tree = () => ({ x: w - Math.min(w, h) * 0.12, base: h, top: h - Math.min(w, h) * 0.38 });

    function drawTree() {
      const t = tree(), s = Math.min(w, h);
      ctx.fillStyle = '#02040c';
      ctx.fillRect(t.x - s * 0.012, t.top + s * 0.1, s * 0.024, t.base - t.top);
      for (const [dx, dy, r] of [[0, 0.06, 0.1], [-0.07, 0.12, 0.08], [0.07, 0.12, 0.08], [-0.03, 0, 0.07], [0.04, 0.02, 0.07]]) {
        ctx.beginPath();
        ctx.arc(t.x + dx * s, t.top + dy * s, r * s, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function newLeaf(now) {
      const t = tree(), s = Math.min(w, h);
      return { x0: t.x - s * 0.05, y0: t.top + s * 0.1, born: now, fall: 9000 + Math.random() * 4000 };
    }

    function tick(now) {
      if (!start) start = now;
      const t = now - start;
      ctx.clearRect(0, 0, w, h);

      for (const s of stars) {
        ctx.globalAlpha = still ? 0.8 : 0.55 + 0.45 * Math.sin(s.p + t / 900);
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;

      // Half moon: lit on its right half, crossing the sky once every ten minutes.
      const r = Math.min(w, h) * 0.045;
      const mx = still ? w * 0.2 : (-r + ((t / 600000) % 1) * (w + 2 * r));
      const my = h * 0.15;
      ctx.fillStyle = '#f4efd9';
      ctx.shadowColor = 'rgba(244, 239, 217, 0.6)'; ctx.shadowBlur = r;
      ctx.beginPath(); ctx.arc(mx, my, r, -Math.PI / 2, Math.PI / 2); ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;

      if (!still) {
        if (!shot && now > nextShot) {
          shot = { x: Math.random() * w * 0.7, y: Math.random() * h * 0.3, born: now, life: 900 };
        }
        if (shot) {
          const k = (now - shot.born) / shot.life;
          if (k >= 1) { shot = null; nextShot = now + 4000 + Math.random() * 8000; }
          else {
            const len = Math.min(w, h) * 0.25;
            const hx = shot.x + k * len * 1.6, hy = shot.y + k * len * 0.6;
            const g = ctx.createLinearGradient(hx, hy, hx - len * 0.4, hy - len * 0.15);
            g.addColorStop(0, `rgba(255,255,255,${1 - k})`); g.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.strokeStyle = g; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx - len * 0.4, hy - len * 0.15); ctx.stroke();
          }
        }
      }

      drawTree();

      if (!leaf) leaf = newLeaf(now);
      const k = still ? 0.4 : (now - leaf.born) / leaf.fall;
      if (k >= 1) leaf = newLeaf(now);
      else {
        const s = Math.min(w, h);
        const lx = leaf.x0 - k * s * 0.25 + Math.sin(k * Math.PI * 6) * s * 0.03;
        const ly = leaf.y0 + k * (h - leaf.y0);
        ctx.save();
        ctx.translate(lx, ly); ctx.rotate(Math.sin(k * Math.PI * 6) * 0.8);
        ctx.fillStyle = '#7a5a2a';
        ctx.beginPath(); ctx.ellipse(0, 0, s * 0.012, s * 0.006, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      if (!still) frame = requestAnimationFrame(tick);
    }

    addEventListener('resize', () => { if (!canvas.hidden) size(); });

    return on => {
      canvas.hidden = !on;
      cancelAnimationFrame(frame);
      if (on) { size(); start = 0; frame = requestAnimationFrame(tick); }
    };
  })();

  function draw() {
    const [x, y] = pages[page];
    const thin = x.includes('thin') || y.includes('thin');
    const base = Object.fromEntries(names.map(n => [n, P[n].v]));
    cells.forEach((cell, i) => {
      const col = i % 10, row = 9 - Math.floor(i / 10);
      cell.style.cssText = glass({ ...base, [x]: stop(x, col), [y]: stop(y, row) }, thin);
    });
  }

  function show() {
    const [x, y] = pages[page];
    $('page').textContent = `${page + 1} / ${pages.length} · pattern ${pattern + 1} / ${patterns.length}`;
    document.body.style.background = patterns[pattern] === 'none' ? '' : patterns[pattern];
    $('clouds').hidden = pattern !== SKY;
    night(pattern === NIGHT);
    for (const [axis, p] of [['x', x], ['y', y]]) {
      $(axis + '-name').textContent = p;
      $(axis + '-min').value = P[p].lo;
      $(axis + '-max').value = P[p].hi;
      const slider = $(axis);
      slider.min = P[p].lo;
      slider.max = P[p].hi;
      slider.step = (P[p].hi - P[p].lo) / 100;
      slider.value = P[p].f ?? P[p].v;
    }
    draw();
  }

  for (const axis of ['x', 'y']) {
    const which = () => pages[page][axis === 'x' ? 0 : 1];
    $(axis).addEventListener('input', e => { P[which()].f = round(Number(e.target.value)); draw(); });
    for (const end of ['min', 'max']) {
      $(axis + '-' + end).addEventListener('change', e => {
        const p = P[which()], n = Number(e.target.value);
        if (!Number.isFinite(n)) return;
        if (end === 'min' && n < p.hi) p.lo = n;
        if (end === 'max' && n > p.lo) p.hi = n;
        show();
      });
    }
  }

  // L and R page through every pair, up and down through the patterns. Caught
  // before a focused slider sees them. Inside a number box the keys type.
  addEventListener('keydown', e => {
    if (e.target.classList?.contains('num')) return;
    const k = e.key.toLowerCase();
    if (k === 'l' || k === 'arrowleft') page = (page - 1 + pages.length) % pages.length;
    else if (k === 'r' || k === 'arrowright') page = (page + 1) % pages.length;
    else if (k === 'arrowup') pattern = (pattern + 1) % patterns.length;
    else if (k === 'arrowdown') pattern = (pattern - 1 + patterns.length) % patterns.length;
    else return;
    e.preventDefault();
    e.stopPropagation();
    show();
  }, true);

  show();
</script>
</body>
</html>
